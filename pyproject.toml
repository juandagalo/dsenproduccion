[project]
name = "DSEnProduccion"
version = "0.1.0"
description = "A short description of the project."
authors = [
    "Daniel Lopez <juandagarcial@gmail.com>",
]
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "numpy>=2.4.2",
    "pandas[parquet]==2.3.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
]

[project.urls]
documentation = "https://juandagalo.github.io/dsenproduccion"
repository = "https://github.com/juandagalo/dsenproduccion"


[dependency-groups]
dev = [
    "pre-commit>=4.6.0", # Code linting and formatting
    "pytest>=9.0.3", # Testing framework
    "pytest-cookies>=0.7.0",
    "pytest-cov>=7.1.0",
    "cruft[pyproject]>=2.16.0",# Automated Cookiecutter template synchronization
    "matplotlib>=3.10.9",
    "jupyter>=1.1.1",
    "seaborn>=0.13.2",
]

#
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "pymdown-extensions>=10.21.2",
]
#
app = [
    "streamlit>=1.45.0",
    "plotly>=6.1.0",
]

[tool.uv]
package = false
default-groups = [
    "dev",
#
    "docs",
#
    "app",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.paths]
source = ["src/"]

[tool.coverage.run]
source = ["src"]
omit = ["**/__init__.py"]
