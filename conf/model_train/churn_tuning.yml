input_path: "data/03_primary/Churn/churn_primary.parquet"
feature_config_path: "conf/data_preparation/features.yml"
baseline_config_path: "conf/model_train/churn.yml"
model_to_tune: "logistic_regression"
target: "Churn"

cv:
  n_splits: 5
  shuffle: true
  random_state: 42

scoring: "roc_auc"
refit: true

param_grid:
  - model__C: [0.01, 0.1, 0.5, 0.8, 1.0, 2.0, 5.0]
    model__l1_ratio: [0.0, 1.0]
    model__solver: ["saga"]

model_output_path: "data/06_models/Churn"
reporting_output_path: "data/08_reporting/Churn"
tuned_pipeline_filename: "churn_tuned_pipeline.joblib"
tuning_results_filename: "tuning_results.json"
baseline_cv_results_path: "data/08_reporting/Churn/cv_results.json"
